<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addleshaw Goddard LLP</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #1e2229 0%, #0d0f12 100%);
      color: #f3f4f6;
      overflow-x: hidden;
      position: relative;
    }

    /* Background Watermark & Typography */
    .bg-branding {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(3rem, 9vw, 9rem);
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.045);
      user-select: none;
      pointer-events: none;
      white-space: nowrap;
      text-align: center;
      line-height: 1.1;
      z-index: 1;
      text-shadow: 0 0 40px rgba(255, 255, 255, 0.02);
    }

    .bg-sub-branding {
      position: absolute;
      bottom: 24px;
      font-size: 0.85rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.2);
      user-select: none;
      pointer-events: none;
      z-index: 1;
    }

    /* Container */
    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      width: 90%;
      max-width: 580px;
      text-align: center;
    }

    /* The Black Button with No Text */
    .black-button {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
      outline: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85),
                  inset 0 1px 2px rgba(255, 255, 255, 0.25),
                  0 0 0 1px rgba(0, 0, 0, 0.9);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .black-button:hover {
      transform: translateY(-2px) scale(1.05);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.95),
                  0 0 20px rgba(255, 255, 255, 0.08),
                  inset 0 1px 3px rgba(255, 255, 255, 0.3);
    }

    .black-button:active {
      transform: translateY(1px) scale(0.96);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.8),
                  inset 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    /* Click indicator pulse ring */
    .black-button::after {
      content: '';
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .black-button:hover::after {
      opacity: 1;
    }

    /* Output message panel */
    .message-panel {
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px 32px;
      border-radius: 16px;
      background: rgba(18, 21, 26, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      width: 100%;
    }

    .message-panel.active {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .main-text {
      font-size: 1.45rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .secondary-text {
      font-size: 1rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pass-code {
      display: inline-block;
      background: #090b0e;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 2px 10px;
      border-radius: 6px;
      color: #38bdf8;
      font-family: monospace;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    /* Passcode Unlock Form */
    .unlock-container {
      margin-top: 8px;
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 320px;
    }

    .passcode-input {
      flex: 1;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      padding: 10px 14px;
      font-size: 0.95rem;
      text-align: center;
      letter-spacing: 0.15em;
      outline: none;
      transition: border-color 0.2s;
    }

    .passcode-input:focus {
      border-color: #38bdf8;
    }

    .unlock-btn {
      background: #1f2937;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .unlock-btn:hover {
      background: #374151;
    }

    .error-msg {
      color: #f87171;
      font-size: 0.82rem;
      display: none;
    }

    /* Unlocked Homepage View */
    .homepage-view {
      display: none;
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      padding: 24px;
      text-align: left;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.1);
      margin-top: 12px;
    }

    .homepage-view h3 {
      font-size: 1.25rem;
      color: #38bdf8;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .homepage-view p {
      font-size: 0.92rem;
      color: #cbd5e1;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Background Text -->
  <div class="bg-branding" aria-hidden="true">
    ADDLESHAW<br>GODDARD LLP
  </div>
  <div class="bg-sub-branding">
    Addleshaw Goddard LLP
  </div>

  <!-- Interactive Centerpiece -->
  <div class="container">
    <!-- Black button with NO text -->
    <button class="black-button" id="triggerBtn" aria-label="Activate"></button>

    <!-- Content revealed on click -->
    <div class="message-panel" id="messagePanel">
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Status Active</span>
      </div>

      <div class="main-text" id="eventStatus">
        even started
      </div>

      <div class="secondary-text">
        homepage protect by pass <span class="pass-code">4343</span>
      </div>

      <!-- Optional interactive authentication to access protected homepage -->
      <form class="unlock-container" id="passcodeForm" onsubmit="handleUnlock(event)">
        <input 
          type="password" 
          id="passInput" 
          class="passcode-input" 
          placeholder="Enter pass 4343" 
          maxlength="8" 
          autocomplete="off"
        />
        <button type="submit" class="unlock-btn">Unlock</button>
      </form>
      <div class="error-msg" id="errorMsg">Incorrect passcode. Please enter 4343.</div>

      <!-- Protected Homepage Container -->
      <div class="homepage-view" id="homepageView">
        <h3>🔒 Homepage Unlocked</h3>
        <p>Welcome to the <strong>Addleshaw Goddard LLP</strong> protected homepage. The event has been successfully initialized and authenticated.</p>
      </div>
    </div>
  </div>

  <script>
    const triggerBtn = document.getElementById('triggerBtn');
    const messagePanel = document.getElementById('messagePanel');
    const passInput = document.getElementById('passInput');
    const errorMsg = document.getElementById('errorMsg');
    const homepageView = document.getElementById('homepageView');

    triggerBtn.addEventListener('click', () => {
      // Reveal the message panel
      messagePanel.classList.add('active');
      passInput.focus();
    });

    function handleUnlock(event) {
      event.preventDefault();
      const code = passInput.value.trim();
      if (code === '4343') {
        errorMsg.style.display = 'none';
        homepageView.style.display = 'block';
        passInput.disabled = true;
      } else {
        errorMsg.style.display = 'block';
        passInput.value = '';
        passInput.focus();
      }
    }
  </script>
</body>
</html>
